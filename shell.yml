apiVersion: v1
kind: Pod
metadata:
 name: shell
spec:
  containers:
  - name: shell
    image: allenluce/shell:latest
    securityContext:
       privileged: true
    volumeMounts:
    - mountPath: /host
      name: host-root
    hostIPC: true
    hostNetwork: true
    hostPID: true
    volumes:
    - hostPath:
        path: /
        type: ""
      name: host-root
